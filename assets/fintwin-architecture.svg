<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="FinTwin AI architecture: browser to React web app; web app to identity service and to the Java core API; core API sends questions with a signed token to the Python AI service, which calls back with read-only tool calls and prompts the LLM; both Java services use PostgreSQL.">
  <title>FinTwin AI architecture</title>
  <style>
    .cap { font: 600 14px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2.2px; fill: #A78BFA; }
    .foot { font: 500 15px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #B9B9C9; }
    .foot tspan { fill: #FFFFFF; font-weight: 600; }
    .ntitle { font: 700 18px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
    .nsub { font: 500 13px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8B8BA3; }
    .elabel { font: 500 12.5px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #B9B9C9; }
    .edge { fill: none; stroke: #A78BFA; stroke-opacity: .45; stroke-width: 1.4; stroke-dasharray: 5 5; animation: flow 1.2s linear infinite; }
    .halo { animation: halo 2.6s ease-in-out infinite; }
    .pkt { filter: drop-shadow(0 0 4px currentColor); }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes halo { 0%,100% { stroke-opacity: .15; } 50% { stroke-opacity: .6; } }
    @media (prefers-reduced-motion: reduce) {
      .edge, .halo { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="glowR" cx="82%" cy="45%" r="45%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="22%" cy="0%" r="40%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fadeX" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask"><rect width="100%" height="100%" fill="url(#fadeX)"/></mask>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA" fill-opacity="0.7"/>
    </marker>
  </defs>
  
  <rect width="1200" height="430" rx="18" fill="#0B0B12"/>
  <rect width="1200" height="430" rx="18" fill="url(#glowR)"/>
  <rect width="1200" height="430" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="430" rx="18" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="18" fill="none" stroke="#A78BFA" stroke-opacity="0.18"/>
  <text x="70" y="56" class="cap">FINTWIN AI · HOW THE PIECES TALK</text>
  
  <path id="e1" d="M226,135.0 H294" class="edge" marker-end="url(#arrow)"/>
  <text x="260.0" y="123.0" class="elabel" text-anchor="middle">HTTPS</text>
  <path id="e2" d="M506,135.0 H574" class="edge" marker-end="url(#arrow)"/>
  <text x="540.0" y="123.0" class="elabel" text-anchor="middle">REST · JWT</text>
  <path id="e3" d="M806,123.0 H904" class="edge" marker-end="url(#arrow)"/>
  <text x="855.0" y="113.0" class="elabel" text-anchor="middle">signed token</text>
  <path id="e4" d="M904,147.0 H806" class="edge" marker-end="url(#arrow)"/>
  <text x="855.0" y="171.0" class="elabel" text-anchor="middle">tool calls</text>
  <path id="e5" d="M400.0,180 V270" class="edge" marker-end="url(#arrow)"/>
  <text x="412.0" y="230.0" class="elabel" text-anchor="start">login · 2FA</text>
  <path id="e6" d="M690.0,180 V270" class="edge" marker-end="url(#arrow)"/>
  <text x="702.0" y="230.0" class="elabel" text-anchor="start">JPA</text>
  <path id="e7" d="M1020.0,180 V270" class="edge" marker-end="url(#arrow)"/>
  <text x="1032.0" y="230.0" class="elabel" text-anchor="start">prompt</text>
  <path id="e8" d="M506,315.0 H574" class="edge" marker-end="url(#arrow)"/>
  <text x="540.0" y="303.0" class="elabel" text-anchor="middle">users</text>
  
  <g>
    
    <rect x="70" y="96" width="150" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="145.0" y="130" class="ntitle" text-anchor="middle">Browser</text>
    <text x="145.0" y="152" class="nsub" text-anchor="middle">you, or the demo</text>
  </g>
  <g>
    
    <rect x="300" y="96" width="200" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="400.0" y="130" class="ntitle" text-anchor="middle">Web app</text>
    <text x="400.0" y="152" class="nsub" text-anchor="middle">React 19 · Vite · nginx</text>
  </g>
  <g>
    
    <rect x="580" y="96" width="220" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="690.0" y="130" class="ntitle" text-anchor="middle">Core API</text>
    <text x="690.0" y="152" class="nsub" text-anchor="middle">Java 21 · Spring Boot 3.5</text>
  </g>
  <g>
    <rect x="906" y="92" width="228" height="86" rx="16" fill="none" stroke="#A78BFA" stroke-opacity="0.5" class="halo"/>
    <rect x="910" y="96" width="220" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="url(#accent)" stroke-opacity="1" stroke-width="1.6"/>
    <text x="1020.0" y="130" class="ntitle" text-anchor="middle">AI service</text>
    <text x="1020.0" y="152" class="nsub" text-anchor="middle">Python · FastAPI · evals</text>
  </g>
  <g>
    
    <rect x="300" y="276" width="200" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="400.0" y="310" class="ntitle" text-anchor="middle">Identity service</text>
    <text x="400.0" y="332" class="nsub" text-anchor="middle">JWT · refresh rotation · 2FA</text>
  </g>
  <g>
    
    <rect x="580" y="276" width="220" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="690.0" y="310" class="ntitle" text-anchor="middle">PostgreSQL</text>
    <text x="690.0" y="332" class="nsub" text-anchor="middle">AES-256-GCM fields · Flyway</text>
  </g>
  <g>
    
    <rect x="910" y="276" width="220" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1"/>
    <text x="1020.0" y="310" class="ntitle" text-anchor="middle">LLM</text>
    <text x="1020.0" y="332" class="nsub" text-anchor="middle">qwen2.5 via Ollama · GPU</text>
  </g>
  
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e1"/></animateMotion>
    <animate attributeName="opacity" dur="1.6s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion>
    <animate attributeName="opacity" dur="1.6s" begin="0.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.8s" begin="1.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e3"/></animateMotion>
    <animate attributeName="opacity" dur="1.8s" begin="1.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#34D399" class="pkt" opacity="0">
    <animateMotion dur="1.8s" begin="1.9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion>
    <animate attributeName="opacity" dur="1.8s" begin="1.9s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e5"/></animateMotion>
    <animate attributeName="opacity" dur="1.6s" begin="0.3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e6"/></animateMotion>
    <animate attributeName="opacity" dur="1.6s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.6s" begin="2.3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e7"/></animateMotion>
    <animate attributeName="opacity" dur="1.6s" begin="2.3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#A78BFA" class="pkt" opacity="0">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e8"/></animateMotion>
    <animate attributeName="opacity" dur="1.6s" begin="0.8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <text x="600.0" y="400" class="foot" text-anchor="middle"><tspan>Java owns the data, Python owns the thinking.</tspan> The AI service has no database access: the model asks the core API, which decides what each user may see.</text>
</svg>
