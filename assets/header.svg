<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Syed Mohammad Saad, Software Engineer. Building FinTwin AI, an AI money copilot for India.">
  <title>Syed Mohammad Saad · Software Engineer</title>
  <style>
    .kick { font: 600 14px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2.4px; fill: #A78BFA; }
    .name { font: 800 54px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; fill: #FFFFFF; }
    .prompt { font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #A78BFA; }
    .type { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #C4B5FD; }
    .live { font: 500 15px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #B9B9C9; }
    .live tspan { fill: #FFFFFF; font-weight: 600; }
    .num { font: 800 26px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
    .lbl { font: 500 14px -apple-system, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #B9B9C9; }
    .card { animation: glow 6s ease-in-out infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 72px 252px; }
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes glow { 0%, 40%, 100% { stroke-opacity: .32; fill-opacity: .045; } 15% { stroke-opacity: .95; fill-opacity: .09; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-60px, 24px); } }
    @media (prefers-reduced-motion: reduce) {
      .card, .blink, .pulse, .orb { animation: none; }
    }
  </style>
